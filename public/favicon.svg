<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="forgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF70"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="forgeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0A0D12"/>
  <!-- Overlapping Aspect Ratio Frames -->
  <!-- 2:3 Ratio Frame -->
  <rect x="14" y="8" width="36" height="48" rx="3" fill="none" stroke="url(#forgeGold)" stroke-width="1.8" opacity="0.9"/>
  <!-- 3:4 Ratio Frame -->
  <rect x="18" y="12" width="32" height="40" rx="3" fill="none" stroke="url(#forgeCyan)" stroke-width="1.6" opacity="0.75"/>
  <!-- 4:5 Ratio Frame -->
  <rect x="22" y="16" width="28" height="32" rx="3" fill="none" stroke="#10B981" stroke-width="1.4" opacity="0.6"/>
  <!-- Center Core Pixel Node -->
  <circle cx="32" cy="32" r="4.5" fill="url(#forgeGold)"/>
  <!-- Crop Corner Marks -->
  <path d="M 10 14 L 10 10 L 14 10" fill="none" stroke="url(#forgeGold)" stroke-width="1.5"/>
  <path d="M 54 14 L 54 10 L 50 10" fill="none" stroke="url(#forgeGold)" stroke-width="1.5"/>
  <path d="M 10 50 L 10 54 L 14 54" fill="none" stroke="url(#forgeGold)" stroke-width="1.5"/>
  <path d="M 54 50 L 54 54 L 50 54" fill="none" stroke="url(#forgeGold)" stroke-width="1.5"/>
</svg>
